# =============================================================================
# Parameters for lane_controller_node + waypoint_manager_node
# Pipeline: /lane_mask_bev -> ROI crop -> HoughLinesP -> polynomial fit -> adaptive steering
#
# SCALE NOTE: all pixel parameters (lane_width_*, hough_*_px) are expressed
# at bev_scale=1.0 (native mask 320×128). The code automatically multiplies them
# by bev_scale -> no manual update needed when changing bev_scale.
# =============================================================================

lane_controller:
  # ---- Topic ----
  mask_topic:   "/lane_mask_bev"
  cmd_topic:    "/lane_controller/cmd_vel"   # proposed only; orchestrator forwards to hardware
  debug_topic:  "/lane_debug/image"
  state_topic:  "/lane_controller/state"
  enable_topic: "/lane_controller/enable"

  # ---- Velocity ---- Validated Velocity linear_x_speed 0.10/0.15 m/s, max_angular_z 0.80/1.20 rad/s
  linear_x_speed: 0.15   # m/s forward
  max_linear_y:   0.08   # m/s strafe (mecanum)
  max_angular_z:  0.90   # rad/s (classic)

  # ---- Drive mode ----
  drive_mode: "classic"  # "mecanum" -> linear.y | "classic" -> angular.z

  # ---- BEV mode ----
  use_bev: true     # false = use raw perspective mask (no BEV calibration required)
  bev_scale: 2.0    # BEV mask upscaling (1.0=320×128, 2.0=640×256, 2.5=800×320)
                    # all pixel params are scaled automatically

  # ---- no-BEV parameters (used only if use_bev: false) ----
  # Also set: mask_topic: "/lane_mask"  and  lane_fit_mode: "quadratic"
  lane_width_bottom_frac: 0.55  # lane width as fraction of dst_w (no-BEV)
  no_bev_roi_top_frac: 0.10     # ignore top X% of the mask (no-BEV)

  # ---- ROI Hough ----
  # BEV mode:    ignores the top portion of the BEV mask (far from robot). Must be < center_y_ratio.
  # no-BEV mode: overridden by no_bev_roi_top_frac (above).
  hough_roi_top_frac: 0.3  # [0-1]; orange line in the debug image

  # ---- HoughLinesP - values at bev_scale=1.0, auto-scaled by the code ----
  hough_threshold:     30  # minimum votes (does NOT scale with bev_scale)
  hough_min_line_px:    5  # min Hough segment length in px  [@ 1.0x]
  hough_max_gap_px:    20  # max gap in px to join segments  [@ 1.0x]
  hough_min_length_px:  8  # min averaged line length in px for validation  [@ 1.0x]
  line_height_ratio:  1.0  # vertical extent of the fitted line (1.0 = full height)

  # ---- Lane geometry - values at bev_scale=1.0, auto-scaled by the code ----
  lane_width_px:      252   # lane width in px  [@ 1.0x] (Wm≈504 measured at 2.0x)
  center_y_ratio:     0.80  # [0=top, 1=bot] measurement point; >= hough_roi_top_frac
  max_steering_angle: 48.0  # maximum steering angle in degrees
  single_line_offset:  0.0  # extra px offset for center estimation (single line)  [@ 1.0x]
  min_distance_from_center: 0.0  # min distance from center in px  [@ 1.0x]
  min_right_margin_px: 0.0
  min_left_margin_px:  0.0

  # ---- Dynamic lane width calibration (only with use_bev=true) ----
  # When both lines are visible, |rx-lx| at center_y updates the current estimate via EMA.
  # Used for single-line estimation.
  # Values at bev_scale=1.0, auto-scaled by the code.
  lane_width_dynamic_enable: true
  lane_width_ema_alpha:      0.10   # 0=never updates, 1=follows only the latest measurement
  lane_width_min_px:         190    # lower bound  [@ 1.0x]  -> 380px @ 2.0x
  lane_width_max_px:         315    # upper bound  [@ 1.0x]  -> 630px @ 2.0x
  lane_width_sanity_band:    0.25   # measurement accepted if |meas-dyn|/dyn <= band
  lane_width_reset_after:    0      # frames without 2 lines before resetting dyn estimate (0=never)

  # ---- Line fit mode ----
  lane_fit_mode: "linear"   # "linear" = line | "quadratic" = parabola | "auto" = parabola if >=6 pts

  # ---- Line validation ----
  min_valid_points: 0  # check-y threshold to pass (0 = accept all)

  # ---- Adaptive EMA smoothing ----
  # α = clip(alpha_base + 0.35*(1-exp(-|Δangle|/delta_scale)), base, 0.95)
  angle_smooth_alpha_base:  0.50  # base α (lower = smoother; recommended range 0.40-0.65)
  angle_smooth_delta_scale: 10.0  # adaptive EMA scale (deg; higher = less responsive)

  # ---- Class IDs ----
  class_lane_marking: 2
  class_lane_dashed:  3

  # ---- Debug ----
  publish_debug: true
  debug_scale:   0.5
  control_rate_hz: 25  # control loop rate in Hz - align with model FPS (25-30)
  enable_log: true     # false = suppress all [lane_ctrl_v2] runtime log messages

# =============================================================================
waypoint_manager:
  map_file: "/tmp/UNSET_MAP_FILE"  # overridden at runtime by start_all.sh
  odom_topic: "/odom"
  goal_topic: "/waypoint_manager/goal"
  status_topic: "/waypoint_manager/status"
  waypoint_tolerance: 0.25
  rate_hz: 25

# =============================================================================
# orchestrator — sole publisher of /jetauto_controller/cmd_vel
# Owns: junction rotation, map fallback, lane/map blending
# =============================================================================
orchestrator:
  rate_hz: 25.0
  stale_timeout: 0.5         # seconds before a stale proposal is treated as zero

  # ---- Fallback blending (lane=primary; map only when lane lost) ----
  # alpha=0 -> pure lane (always during NAVIGATING)
  # alpha ramps 0->1 over hold_ramp_ticks when lane is HOLD/STOP
  hold_ramp_ticks: 15        # HOLD ticks before entering full FALLBACK
  recovery_ticks: 3          # consecutive OK+near ticks before exiting FALLBACK
  fallback_recovery_radius: 0.50  # m — must be within this dist of a path node to exit FALLBACK

  # ---- Junction rotation ----
  junction_radius: 0.30      # m — distance to trigger junction maneuver
  junction_align_deg: 22.0   # deg — loose threshold; lane takes over once roughly aligned
  junction_spin_speed: 0.40  # rad/s cap for in-place rotation
  junction_alpha: 1       # spin blend: 90% map heading, 10% lane hint (0 if lane bad)

  # ---- Drift auto-correction ----
  # Position fix fires once per node when dist < drift_trigger_radius (NAVIGATING only).
  # Theta fix fires at each JUNCTION completion (robot intentionally aligned).
  drift_pos_alpha: 0.0         # EMA weight for tx/ty (0=disabled, 1=snap)
  drift_theta_alpha: 0.0       # EMA weight for theta (0=disabled, 1=snap)
  drift_min_correct_m: 0.03    # ignore errors smaller than this (noise floor)
  drift_max_correct_m: 0.50    # reject errors larger than this (broken remap)
  drift_trigger_radius: 0.20   # m — fire position fix when closer than this to target node

  # ---- Turn-angle-aware junction ----
  gentle_turn_deg: 20.0      # junctions with turn angle below this skip the rotation maneuver

  # ---- Roundabout ----
  roundabout_drive_speed: 0.10  # m/s — pure map following speed inside roundabout

  # ---- Map pure-pursuit (FALLBACK state) ----
  lookahead_m: 0.50
  map_drive_speed: 0.04      # m/s (slower than lane speed)
  map_kp: 1.2                # angular.z = kp * heading_error
  map_max_angular: 0.80      # rad/s clamp
