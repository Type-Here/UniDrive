# =============================================================================
# Parametri lane_controller_node + waypoint_manager_node
# Pipeline: /lane_mask_bev → ROI crop → HoughLinesP → fit polinomiale → sterzata adattiva
#
# NOTA SCALA: tutti i parametri in pixel (lane_width_*, hough_*_px) sono espressi
# a bev_scale=1.0 (maschera nativa 320×128). Il codice li moltiplica automaticamente
# per bev_scale → non serve aggiornarli manualmente quando si cambia bev_scale.
# =============================================================================

lane_controller:
  # ---- Topic ----
  mask_topic:   "/lane_mask_bev"
  cmd_topic:    "/jetauto_controller/cmd_vel"
  debug_topic:  "/lane_debug/image"
  state_topic:  "/lane_controller/state"
  enable_topic: "/lane_controller/enable"

  # ---- Velocità ----
  linear_x_speed: 0.10   # m/s avanti
  max_linear_y:   0.08   # m/s strafe (mecanum)
  max_angular_z:  0.80   # rad/s (classic)

  # ---- Modalità di guida ----
  drive_mode: "classic"  # "mecanum" → linear.y | "classic" → angular.z

  # ---- Modalità BEV ----
  use_bev: true     # false = usa maschera raw in prospettiva (no calibrazione BEV richiesta)
  bev_scale: 2.0    # upscaling maschera BEV (1.0=320×128, 2.0=640×256, 2.5=800×320)
                    # tutti i param in px si adattano automaticamente

  # ---- Parametri no-BEV (usati solo se use_bev: false) ----
  # Usare anche: mask_topic: "/lane_mask"  e  lane_fit_mode: "quadratic"
  lane_width_bottom_frac: 0.55  # larghezza corsia come fraz. di dst_w (no-BEV)
  no_bev_roi_top_frac: 0.10     # ignora top X% della maschera (no-BEV)

  # ---- ROI Hough ----
  # BEV mode:    ignora il top della maschera BEV (lontano dal robot). Deve essere < center_y_ratio.
  # no-BEV mode: sostituito da no_bev_roi_top_frac (sopra).
  hough_roi_top_frac: 0.3  # [0-1]; linea arancione nel debug

  # ---- HoughLinesP — valori a bev_scale=1.0, auto-scalati dal codice ----
  hough_threshold:     30  # voti minimi (NON scala con bev_scale)
  hough_min_line_px:    5  # px min segmento Hough  [@ 1.0x]
  hough_max_gap_px:    20  # px gap max per unire segmenti  [@ 1.0x]
  hough_min_length_px:  8  # px min linea mediata per validazione  [@ 1.0x]
  line_height_ratio:  1.0  # estensione verticale linea (1.0 = tutta l'altezza)

  # ---- Geometria corsia — valori a bev_scale=1.0, auto-scalati dal codice ----
  lane_width_px:      252   # px larghezza corsia  [@ 1.0x] (Wm≈504 misurato a 2.0x)
  center_y_ratio:     0.50  # [0=top, 1=bot] punto di misura; >= hough_roi_top_frac
  max_steering_angle: 48.0  # gradi massimi di sterzata
  single_line_offset:  0.0  # px offset aggiuntivo stima centro (singola linea)  [@ 1.0x]
  min_distance_from_center: 0.0  # px distanza min dal centro  [@ 1.0x]
  min_right_margin_px: 0.0
  min_left_margin_px:  0.0

  # ---- Calibrazione dinamica larghezza corsia (solo use_bev=true) ----
  # Quando vediamo entrambe le linee, |rx-lx| a center_y aggiorna via EMA
  # la stima corrente. Usata per single-line estimation.
  # Valori a bev_scale=1.0, auto-scalati dal codice.
  lane_width_dynamic_enable: true
  lane_width_ema_alpha:      0.10   # 0=mai aggiorna, 1=segue solo l'ultima misura
  lane_width_min_px:         190    # bound inferiore  [@ 1.0x]  → 380px @ 2.0x
  lane_width_max_px:         315    # bound superiore  [@ 1.0x]  → 630px @ 2.0x
  lane_width_sanity_band:    0.25   # misura accettata se |meas-dyn|/dyn <= band
  lane_width_reset_after:    0      # frame senza 2-lines prima di azzerare dyn (0=mai)

  # ---- Modalità fit linee ----
  lane_fit_mode: "linear"   # "linear" retta | "quadratic" parabola | "auto" parabola se >=6 pt

  # ---- Validazione linee ----
  min_valid_points: 0  # check-y da superare (0 = accetta tutto)

  # ---- Smoothing EMA adattivo ----
  # α = clip(alpha_base + 0.35*(1-exp(-|Δangle|/delta_scale)), base, 0.95)
  angle_smooth_alpha_base:  0.50  # base α (più basso = più smooth; range consigliato 0.40-0.65)
  angle_smooth_delta_scale: 10.0  # scala adattiva EMA (deg; più alto = meno reattivo)

  # ---- Class IDs ----
  class_lane_marking: 2
  class_lane_dashed:  3

  # ---- Debug ----
  publish_debug: true
  debug_scale:   0.5
  control_rate_hz: 25  # Hz loop controllo — allineare al FPS del modello (25-30)

# =============================================================================
waypoint_manager:
  map_file: "/tmp/UNSET_MAP_FILE"  # sovrascritto a runtime da start_all.sh
  odom_topic: "/odom"
  goal_topic: "/waypoint_manager/goal"
  status_topic: "/waypoint_manager/status"
  cmd_topic: "/jetauto_controller/cmd_vel"
  lane_enable_topic: "/lane_controller/enable"

  waypoint_tolerance: 0.14
  junction_slowdown: 0.06
  junction_radius: 0.20
  rate_hz: 25
  goal_completion_msg: "GOAL_REACHED"

# =============================================================================
# map_follower_node.py  --  map-assisted fallback when lane markings are lost
# =============================================================================
map_follower:
  # ---- Trigger / recovery timing ----
  # Number of control ticks (at rate_hz=10 -> 1 tick = 100ms) that lane_controller
  # must stay in HOLD before map_follower takes over.
  hold_fallback_frames: 15   # 1.5 s of no lane before activation

  # Number of consecutive ticks where the lane is visible again before
  # handing back control to the lane controller.
  lane_recovery_frames: 5    # 0.5 s of stable lane before recovery

  # ---- Pure-pursuit parameters ----
  # Lookahead distance (metres). Map nodes are ~12cm apart after smoothing,
  # so 0.50m ~ 4 nodes ahead. Increase for smoother curves; decrease for
  # tighter turns.
  lookahead_m: 0.50

  # Forward speed while in map-follower mode. Keep slower than lane speed
  # to compensate for reduced steering accuracy.
  map_drive_speed: 0.04   # m/s

  # Proportional gain: angular.z = Kp * heading_error
  angular_kp: 1.2
  max_angular_z: 0.80   # rad/s clamp

  # ---- Coordinate frame ----
  # Raw odom (x, y) that corresponds to map origin (node 0).
  # Default 0,0 works when the robot boots with odom at origin.
  # Override these if the robot starts with a non-zero odom reading.
  odom_origin_x: 0.0
  odom_origin_y: 0.0

  # ---- Rate ----
  rate_hz: 10.0

  # ---- Topic overrides (leave as default unless needed) ----
  cmd_topic:        "/jetauto_controller/cmd_vel"
  lane_enable_topic: "/lane_controller/enable"
  odom_topic:       "/odom"
  path_topic:       "/waypoint_manager/path"
  lane_state_topic: "/lane_controller/state"
  nav_status_topic: "/waypoint_manager/status"
  active_topic:     "/map_follower/active"
  state_topic:      "/map_follower/state"
