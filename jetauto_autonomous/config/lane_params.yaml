# =============================================================================
# Parametri lane_controller_node + waypoint_manager_node
# Pipeline: /lane_mask_bev → ROI crop → HoughLinesP → fit polinomiale → sterzata adattiva
# =============================================================================

lane_controller:
  # ---- Topic ----
  mask_topic:   "/lane_mask_bev"
  cmd_topic:    "/jetauto_controller/cmd_vel"
  debug_topic:  "/lane_debug/image"
  state_topic:  "/lane_controller/state"
  enable_topic: "/lane_controller/enable"

  # ---- Velocità ----
  linear_x_speed: 0.05   # m/s avanti
  max_linear_y:   0.08   # m/s strafe (mecanum)
  max_angular_z:  0.80   # rad/s (classic)

  # ---- Modalità di guida ----
  drive_mode: "classic"  # "mecanum" → linear.y | "classic" → angular.z

  # ---- Modalità BEV ----
  use_bev: true     # false = usa maschera raw in prospettiva (no calibrazione BEV richiesta)
  bev_scale: 1.0    # fattore upscaling maschera BEV prima di Hough (1.0 = nativo 320×128)
                    # es. 2.0 → 640×256; adattare lane_width_px proporzionalmente

  # ---- Parametri no-BEV (usati solo se use_bev: false) ----
  # Usare anche: mask_topic: "/lane_mask"  e  lane_fit_mode: "quadratic"
  lane_width_bottom_frac: 0.55  # larghezza corsia stimata come fraz. di dst_w alla riga più bassa
  no_bev_roi_top_frac: 0.45     # ignora top 45% della maschera (riduce rumore prospettivo orizzonte)

  # ---- ROI Hough ----
  # BEV mode:    ignora il top della maschera BEV (lontano dal robot). Deve essere < center_y_ratio.
  # no-BEV mode: sostituito da no_bev_roi_top_frac (sopra).
  hough_roi_top_frac: 0.3  # [0-1]; linea arancione nel debug

  # ---- HoughLinesP ----
  hough_threshold:    50   # voti minimi
  hough_min_line_px:  20   # px min segmento Hough
  hough_max_gap_px:   40   # px gap max per unire segmenti
  hough_min_length_px: 20  # px min linea mediata per validazione
  line_height_ratio:  1.0  # estensione verticale linea (1.0 = tutta l'altezza)

  # ---- Geometria corsia ----
  lane_width_px:      280   # px larghezza corsia BEV — fallback statico finché dyn_lane_width non è inizializzato o se lane_width_dynamic_enable=false
  center_y_ratio:     0.50  # [0=top, 1=bot] punto di misura; >= hough_roi_top_frac; linea magenta nel debug
  max_steering_angle: 48.0  # gradi massimi di sterzata
  single_line_offset: 0.0   # px offset aggiuntivo stima centro (singola linea)
  min_distance_from_center: 0.0  # px distanza min dal centro per accettare una linea
  min_right_margin_px: 0.0
  min_left_margin_px:  0.0

  # ---- Calibrazione dinamica larghezza corsia (solo use_bev=true) ----
  # Quando vediamo entrambe le linee, |rx-lx| a center_y aggiorna via EMA
  # una stima corrente della larghezza corsia. Quando poi vediamo una sola
  # linea, questa stima sostituisce lane_width_px nel calcolo del centro.
  # Tutti i px sono RIFERITI all'immagine post-bev_scale.
  # Se bev_scale=2.0, raddoppia anche lane_width_min_px / lane_width_max_px / lane_width_px.
  lane_width_dynamic_enable: true   # false = usa solo lane_width_px statico
  lane_width_ema_alpha:      0.10   # 0=mai aggiorna, 1=segue solo l'ultima misura
  lane_width_min_px:         180    # bound assoluto inferiore (px post-bev_scale)
  lane_width_max_px:         380    # bound assoluto superiore (px post-bev_scale)
  lane_width_sanity_band:    0.25   # misura accettata se |meas-dyn|/dyn <= band (solo se dyn già inizializzato)
  lane_width_reset_after:    0      # frame consecutivi senza 2-lines prima di azzerare dyn (0 = mai)

  # ---- Modalità fit linee ----
  # "linear"    → retta pura (deg=1, sempre)
  # "quadratic" → parabola se >=3 punti, altrimenti retta  ← consigliato per no-BEV (prospettiva curva)
  # "auto"      → parabola se >=6 punti, altrimenti retta  ← default BEV
  lane_fit_mode: "auto"

  # ---- Validazione linee ----
  min_valid_points: 0  # check-y da superare (0 = accetta tutto)

  # ---- Smoothing EMA adattivo ----
  # α = clip(alpha_base + 0.35*(1-exp(-|Δangle|/delta_scale)), base, 0.95)
  angle_smooth_alpha_base:  0.50  # base α (più basso = più smooth)
  angle_smooth_delta_scale: 10.0  # scala adattiva EMA

  # ---- Class IDs ----
  class_lane_marking: 2
  class_lane_dashed:  3

  # ---- Debug ----
  publish_debug: true
  debug_scale:   0.5
  control_rate_hz: 20  # Hz loop controllo (FPS modello 15-30)

# =============================================================================
waypoint_manager:
  map_file: "/tmp/UNSET_MAP_FILE"  # sovrascritto a runtime da start_all.sh
  odom_topic: "/odom"
  goal_topic: "/waypoint_manager/goal"
  status_topic: "/waypoint_manager/status"
  cmd_topic: "/jetauto_controller/cmd_vel"
  lane_enable_topic: "/lane_controller/enable"

  waypoint_tolerance: 0.14
  junction_slowdown: 0.06
  junction_radius: 0.20
  rate_hz: 10
  goal_completion_msg: "GOAL_REACHED"
